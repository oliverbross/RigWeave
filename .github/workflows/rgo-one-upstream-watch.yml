name: RGO ONE official-source watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

jobs:
  official-source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare reviewed official sources
        run: python3 scripts/check_rgo_one_upstream.py
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgo-one-upstream-watch
          path: build/reports/rgo-one-upstream.*
