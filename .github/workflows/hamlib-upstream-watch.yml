name: Hamlib upstream watch

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-current-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pin, source, licences, registry, and current stable
        run: python3 scripts/check_hamlib_upstream.py --check-latest
