name: SDRoxide upstream watch

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 0"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_sdroxide_upstream.py \
            --json-output sdroxide-upstream-watch.json \
            --markdown-output sdroxide-upstream-watch.md
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdroxide-upstream-watch
          path: |
            sdroxide-upstream-watch.json
            sdroxide-upstream-watch.md
      - if: steps.watch.outputs.exit_code != '0'
        run: exit "${{ steps.watch.outputs.exit_code }}"
