name: MSHV Auto DX Chaser upstream watch

on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * 2"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare the reviewed commit and watched paths
        id: comparison
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_mshv_auto_dx_chaser_upstream.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload bounded JSON and Markdown reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mshv-auto-dx-chaser-upstream-audit
          path: build/reports/mshv-auto-dx-chaser-upstream.*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce comparison result
        if: always()
        env:
          COMPARISON_EXIT: ${{ steps.comparison.outputs.exit_code }}
        run: |
          case "$COMPARISON_EXIT" in
            0) exit 0 ;;
            1) echo "MSHV Auto DX Chaser comparison failed"; exit 1 ;;
            2) echo "MSHV Auto DX Chaser review required"; exit 1 ;;
            *) echo "MSHV Auto DX Chaser comparison returned no valid status"; exit 1 ;;
          esac
