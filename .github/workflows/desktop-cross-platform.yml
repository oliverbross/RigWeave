name: Desktop Cross-Platform Proof

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [feature/windows-desktop-alpha-v1, feature/tci-multirx-waterfall-globe-v1, feature/desktop-flightline-ui-convergence-v1]
    paths:
      - 'desktop/**'
      - 'core/**'
      - '.github/workflows/desktop-cross-platform.yml'

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtserialport qtwebsockets qtlocation qtpositioning'
          cache: true
      - name: Configure same desktop source
        run: cmake -S desktop -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIGWEAVE_BUILD_TESTS=ON
      - name: Build and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build/macos --parallel 2
          ctest --test-dir build/macos --output-on-failure
      - name: Deterministic UI lifecycle stress
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p artifacts
          build/macos/RigWeaveDesktop.app/Contents/MacOS/RigWeaveDesktop --ui-stress-report artifacts/ui-stress-macos.json
      - name: Unsigned app packaging proof
        run: |
          cmake --install build/macos --prefix artifacts/macos
          macdeployqt artifacts/macos/RigWeaveDesktop.app -qmldir=desktop/qml
          rm -f artifacts/macos/RigWeaveDesktop.app/Contents/PlugIns/sqldrivers/libqsqlodbc.dylib \
                artifacts/macos/RigWeaveDesktop.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib \
                artifacts/macos/RigWeaveDesktop.app/Contents/PlugIns/sqldrivers/libqsqlmimer.dylib
          ditto -c -k --sequesterRsrc artifacts/macos/RigWeaveDesktop.app artifacts/macos/RigWeave-macOS-unsigned.zip
          shasum -a 256 artifacts/macos/RigWeave-macOS-unsigned.zip > artifacts/macos/SHA256SUMS.txt
      - name: Deterministic macOS UI gallery
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/macos/RigWeaveDesktop.app/Contents/MacOS/RigWeaveDesktop --gallery-dir artifacts/ui-gallery/1920x1080 --gallery-width 1920 --gallery-height 1080
          build/macos/RigWeaveDesktop.app/Contents/MacOS/RigWeaveDesktop --gallery-dir artifacts/ui-gallery/1440x900 --gallery-width 1440 --gallery-height 900
          build/macos/RigWeaveDesktop.app/Contents/MacOS/RigWeaveDesktop --gallery-dir artifacts/ui-gallery/1512x982 --gallery-width 1512 --gallery-height 982
          build/macos/RigWeaveDesktop.app/Contents/MacOS/RigWeaveDesktop --gallery-dir artifacts/ui-gallery/2560x1440 --gallery-width 2560 --gallery-height 1440
          QT_SCALE_FACTOR=1.5 build/macos/RigWeaveDesktop.app/Contents/MacOS/RigWeaveDesktop --gallery-dir artifacts/ui-gallery/150pct --gallery-width 1280 --gallery-height 720
          for profile in 1440x900 1512x982 1920x1080 2560x1440 150pct; do
            test "$(find "artifacts/ui-gallery/$profile" -name '*.png' | wc -l | tr -d ' ')" = 58
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RigWeave-macOS-unsigned-${{ github.sha }}
          path: |
            artifacts/macos
            artifacts/ui-gallery
            artifacts/ui-stress-macos.json
          if-no-files-found: error
          retention-days: 14
