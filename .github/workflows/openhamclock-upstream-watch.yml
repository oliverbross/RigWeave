name: OpenHamClock upstream watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit stable, preview, and latest release pins
        id: comparison
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_openhamclock_upstream.py \
            --update-issue \
            --issue-repository "$GITHUB_REPOSITORY"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload bounded audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhamclock-upstream-audit
          path: build/reports/openhamclock-upstream.*
          if-no-files-found: error
          retention-days: 30
      - name: Enforce comparison result
        if: always()
        env:
          COMPARISON_EXIT: ${{ steps.comparison.outputs.exit_code }}
        run: |
          case "$COMPARISON_EXIT" in
            0) exit 0 ;;
            1) echo "OpenHamClock comparison failed"; exit 1 ;;
            2) echo "OpenHamClock review required"; exit 1 ;;
            *) echo "OpenHamClock comparison returned no valid status"; exit 1 ;;
          esac
